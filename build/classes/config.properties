# ============================================================================
#  校园报修系统 · 配置文件
#  说明：命令行 -Dkey=value 或环境变量 CAMPUS_CONFIG 指定的外部文件可覆盖本文件
# ============================================================================

# ---------------------------- 系统信息 -------------------------------------
system.name = 校园报修系统
system.version = 1.0.0

# ---------------------------- 运行形态 -------------------------------------
# storage.mode = jdbc   ：使用 MySQL 持久化（正式部署）
# storage.mode = memory ：使用内存库（无需数据库即可运行，用于演示与自测；重启后数据重置）
storage.mode = memory

# 内嵌服务器端口与前端资源目录
server.port = 8080
server.contextPath = /
web.root = webapp

# ---------------------------- 数据库（MySQL）--------------------------------
# 执行 db/schema.sql 与 db/seed.sql 后，将 storage.mode 改为 jdbc 即可切换
db.driver = com.mysql.cj.jdbc.Driver
db.url = jdbc:mysql://127.0.0.1:3306/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
db.username = root
db.password =

# ---------------------------- 业务规则参数 ---------------------------------
# 接单时限（分钟）：设计书表 1.8 规定派单后 2 小时
dispatch.acceptDeadlineMinutes = 120
# 结果确认时限（小时）：设计书表 1.9 规定完成后 24 小时内确认
order.confirmDeadlineHours = 24
