<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        /* 上下文路径引导：兼容 Tomcat 部署在 /app 等非根上下文的情况。
           在解析本页相对资源之前执行，把应用根路径写入 <base> 与 window.__CRS_BASE__。 */
        (function () {
            var p = location.pathname || '/';
            var i = p.lastIndexOf('/');
            var basePath = (i > 0 && p.substring(i + 1).indexOf('.') >= 0) ? p.substring(0, i + 1) : p;
            if (basePath.charAt(basePath.length - 1) !== '/') { basePath += '/'; }
            var base = document.createElement('base');
            base.href = location.origin + basePath;
            document.head.insertBefore(base, document.head.firstChild);
            window.__CRS_BASE__ = basePath.replace(/\/+$/, '');
        })();
    </script>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园报修系统 · 报修审核</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>
        <div class="content">
            <div class="stat-grid" id="statGrid"></div>
            <div class="card">
                <div class="card-head">
                    <h3>待审核报修申请</h3>
                    <span class="muted">审核通过后进入待派单；不受理需填写退回原因并通知报修人</span>
                </div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>报修单号</th><th>报修人</th><th>联系方式</th><th>报修地点</th><th>类别</th>
                                <th>故障描述</th><th>紧急</th><th>提交时间</th><th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="listBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-head"><h3>已审核记录（最近 20 条）</h3></div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table table-compact">
                            <thead><tr><th>单号</th><th>报修人</th><th>地点</th><th>状态</th><th>驳回原因</th><th>更新时间</th></tr></thead>
                            <tbody id="historyBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/audit.js"></script>
</body>
</html>
