<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        /* 上下文路径引导：兼容 Tomcat 部署在 /app 等非根上下文的情况。
           在解析本页相对资源之前执行，把应用根路径写入 <base> 与 window.__CRS_BASE__。 */
        (function () {
            var p = location.pathname || '/';
            var i = p.lastIndexOf('/');
            var basePath = (i > 0 && p.substring(i + 1).indexOf('.') >= 0) ? p.substring(0, i + 1) : p;
            if (basePath.charAt(basePath.length - 1) !== '/') { basePath += '/'; }
            var base = document.createElement('base');
            base.href = location.origin + basePath;
            document.head.insertBefore(base, document.head.firstChild);
            window.__CRS_BASE__ = basePath.replace(/\/+$/, '');
        })();
    </script>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园报修系统 · 维修监督</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>
        <div class="content">
            <div class="card">
                <div class="card-head">
                    <h3>超时监督</h3>
                    <button class="btn btn-warn btn-sm" id="btnRemind">立即发送超时提醒</button>
                </div>
                <div class="card-body">
                    <div class="section-title">超时未接单任务（派单超过 2 小时）</div>
                    <div style="overflow-x:auto">
                        <table class="table table-compact">
                            <thead><tr><th>任务号</th><th>报修单</th><th>维修人员</th><th>地点</th><th>派单时间</th><th>时长(小时)</th></tr></thead>
                            <tbody id="overdueTaskBody"></tbody>
                        </table>
                    </div>
                    <div class="section-title">超时未确认报修单（完成超过 24 小时）</div>
                    <div style="overflow-x:auto">
                        <table class="table table-compact">
                            <thead><tr><th>报修单</th><th>报修人</th><th>地点</th><th>维修人员</th><th>完成登记时间</th></tr></thead>
                            <tbody id="overdueConfirmBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h3>进行中任务跟踪</h3></div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table">
                            <thead><tr><th>报名单</th><th>地点</th><th>类别</th><th>状态</th><th>维修人员</th><th>派单时间</th><th>催办次数</th><th>操作</th></tr></thead>
                            <tbody id="trackBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/monitor.js"></script>
</body>
</html>
