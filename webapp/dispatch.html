<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        /* 上下文路径引导：兼容 Tomcat 部署在 /app 等非根上下文的情况。
           在解析本页相对资源之前执行，把应用根路径写入 <base> 与 window.__CRS_BASE__。 */
        (function () {
            var p = location.pathname || '/';
            var i = p.lastIndexOf('/');
            var basePath = (i > 0 && p.substring(i + 1).indexOf('.') >= 0) ? p.substring(0, i + 1) : p;
            if (basePath.charAt(basePath.length - 1) !== '/') { basePath += '/'; }
            var base = document.createElement('base');
            base.href = location.origin + basePath;
            document.head.insertBefore(base, document.head.firstChild);
            window.__CRS_BASE__ = basePath.replace(/\/+$/, '');
        })();
    </script>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园报修系统 · 派单管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>
        <div class="content">
            <div class="card">
                <div class="card-head">
                    <h3>待派单报修单</h3>
                    <div class="filters">
                        <label>类别<select id="fCategory"><option value="">全部</option></select></label>
                        <label>楼栋<select id="fBuilding"><option value="">全部</option></select></label>
                        <button class="btn btn-ghost btn-sm" id="btnRecalculate">校正在单量</button>
                        <button class="btn btn-ghost btn-sm" id="btnRemind">发送超时提醒</button>
                    </div>
                </div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>报修单号</th><th>报修人</th><th>地点</th><th>类别</th><th>故障描述</th>
                                <th>紧急</th><th>提交时间</th><th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="orderBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head">
                    <h3>维修人员负载与技能</h3>
                    <span class="muted">派单时可参考在单量与技能标签，避免超负荷派单</span>
                </div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table">
                            <thead><tr><th>维修人员</th><th>手机号</th><th>技能标签</th><th>在单量</th><th>当前位置</th><th>状态</th></tr></thead>
                            <tbody id="workerBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/dispatch.js"></script>
</body>
</html>
