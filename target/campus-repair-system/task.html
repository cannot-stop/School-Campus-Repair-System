<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script>
        /* 上下文路径引导：兼容 Tomcat 部署在 /app 等非根上下文的情况。
           在解析本页相对资源之前执行，把应用根路径写入 <base> 与 window.__CRS_BASE__。 */
        (function () {
            var p = location.pathname || '/';
            var i = p.lastIndexOf('/');
            var basePath = (i > 0 && p.substring(i + 1).indexOf('.') >= 0) ? p.substring(0, i + 1) : p;
            if (basePath.charAt(basePath.length - 1) !== '/') { basePath += '/'; }
            var base = document.createElement('base');
            base.href = location.origin + basePath;
            document.head.insertBefore(base, document.head.firstChild);
            window.__CRS_BASE__ = basePath.replace(/\/+$/, '');
        })();
    </script>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园报修系统 · 我的维修任务</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
    <aside id="sidebar"></aside>
    <div class="main">
        <div class="topbar" id="topbar"></div>
        <div class="content">
            <div class="stat-grid" id="statGrid"></div>

            <div class="card">
                <div class="card-head">
                    <h3>维修任务列表</h3>
                    <div class="filters">
                        <label>任务状态
                            <select id="fStatus">
                                <option value="">全部</option>
                                <option value="0">待接单</option>
                                <option value="1">维修中</option>
                                <option value="2">待确认</option>
                                <option value="3">已完成</option>
                            </select>
                        </label>
                        <label>我的位置<input type="text" id="fLocation" placeholder="如：1号教学楼"></label>
                        <button class="btn btn-ghost btn-sm" id="btnLocation">更新位置</button>
                    </div>
                </div>
                <div class="card-body">
                    <div style="overflow-x:auto">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>任务号</th><th>报修单</th><th>地点</th><th>类别</th><th>故障描述</th>
                                <th>紧急</th><th>任务状态</th><th>派单时间</th><th>操作</th>
                            </tr>
                            </thead>
                            <tbody id="listBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/task.js"></script>
</body>
</html>
