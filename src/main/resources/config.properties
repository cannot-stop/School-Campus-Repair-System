# ============================================================================
#  校园报修系统 · 配置文件（内置默认值）
#
#  说明：
#    1. 容器部署（IDEA + Tomcat）时，配置以 webapp/WEB-INF/web.xml 的 context-param 为准；
#    2. 命令行 -Dkey=value、环境变量 CAMPUS_XXX（如 CAMPUS_DB_PASSWORD）优先级最高；
#    3. 本文件的作用是提供默认值并说明各配置项含义。
# ============================================================================

# ---------------------------- 系统信息 -------------------------------------
system.name = 校园报修系统
system.version = 1.0.0

# ---------------------------- 运行形态 -------------------------------------
# storage.mode = mybatis ：MyBatis Mapper + MySQL（正式部署，SQL 见 resources/mapper/*.xml）
# storage.mode = jdbc    ：手写 SQL + MySQL（与 MyBatis 版本等价，保留作为对照实现）
# storage.mode = memory  ：内存库（无需数据库，用于课堂演示；重启后数据重置）
storage.mode = memory

# 前端资源目录（Tomcat 部署时由 Web 根决定，此处仅用于本地诊断）
web.root = webapp

# ---------------------------- 数据库（MySQL）--------------------------------
# 执行 db/schema.sql 与 db/seed.sql 后，把 storage.mode 改为 mybatis 即可切换
# 密码建议通过环境变量 CAMPUS_DB_PASSWORD 传入，避免明文写入仓库
db.driver = com.mysql.cj.jdbc.Driver
db.url = jdbc:mysql://127.0.0.1:3306/campus_repair?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
db.username = root
db.password = 123456

# ---------------------------- 业务规则参数 ---------------------------------
# 接单时限（分钟）：设计书表 1.8 规定派单后 2 小时
dispatch.acceptDeadlineMinutes = 120
# 结果确认时限（小时）：设计书表 1.9 规定完成后 24 小时内确认
order.confirmDeadlineHours = 24
